<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit ? 'Edit Job Opening' : 'Post New Job - WorkHive'})}"></head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card p-4 p-md-5 border-0 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                        <div>
                            <span class="badge-soft-primary mb-2 d-inline-block">
                                <i class="bi bi-briefcase me-1"></i> Job Creator
                            </span>
                            <h3 class="fw-bold text-body mb-1" th:text="${isEdit ? 'Edit Job Posting' : 'Publish New Job Opening'}">Post a Job</h3>
                            <p class="text-secondary small mb-0">Define role details, requirements, and tech stack to attract qualified talent.</p>
                        </div>
                        <a th:href="@{/recruiter/jobs}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Back to Jobs
                        </a>
                    </div>

                    <form th:action="${isEdit ? '/recruiter/jobs/edit/' + jobDto.id : '/recruiter/jobs/new'}" th:object="${jobDto}" method="post">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Job Title *</label>
                                <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Senior Java &amp; Spring Boot Engineer" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Employment Type *</label>
                                <select th:field="*{jobType}" class="form-select" required>
                                    <option th:each="type : ${jobTypes}" th:value="${type}" th:text="${type.label}">Full Time</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Location *</label>
                                <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. San Francisco, CA / Remote" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Annual Salary ($ USD)</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="1000" th:field="*{salary}" class="form-control" placeholder="e.g. 135000">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Application Deadline</label>
                                <input type="date" th:field="*{deadline}" class="form-control">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Key Technical Skills (Comma separated)</label>
                                <input type="text" th:field="*{skillsRequired}" class="form-control" placeholder="e.g. Java, Spring Boot, MySQL, Docker, REST APIs, Microservices">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Job Description *</label>
                                <textarea th:field="*{description}" rows="6" class="form-control" placeholder="Describe the role, day-to-day responsibilities, mission, and team structure..." required></textarea>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Key Requirements &amp; Qualifications</label>
                                <textarea th:field="*{requirements}" rows="4" class="form-control" placeholder="List required years of experience, technical foundations, and preferred degrees..."></textarea>
                            </div>

                            <div class="col-12" th:if="${isEdit}">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" role="switch" id="activeSwitch" th:field="*{active}">
                                    <label class="form-check-label fw-semibold small" for="activeSwitch">Listing is Active &amp; Open for Applications</label>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-check-lg me-1"></i> <span th:text="${isEdit ? 'Save Changes' : 'Publish Job Opening'}">Publish Job</span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

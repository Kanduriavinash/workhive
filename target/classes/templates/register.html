<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Account - WorkHive')}"></head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="py-5 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6 col-xl-5">

                <div class="card auth-card p-4 p-sm-5 border-0">
                    <div class="text-center mb-4">
                        <img th:src="@{/images/logo.png}" alt="WorkHive Logo" style="height: 52px; object-fit: contain;" class="mb-3">
                        <h2 class="fw-bold text-body mb-1">Join WorkHive</h2>
                        <p class="text-secondary small mb-0">Create your account to apply for roles or hire top talent</p>
                    </div>

                    <form th:action="@{/register}" th:object="${userDto}" method="post">
                        <!-- Global error -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger small mb-3">
                            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
                        </div>

                        <!-- Role Selection Toggle Cards -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Account Purpose</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="roleSeeker" value="ROLE_JOB_SEEKER" th:field="*{role}" checked>
                                    <label class="btn btn-outline-primary w-100 py-3 d-flex flex-column align-items-center justify-content-center gap-1" for="roleSeeker">
                                        <i class="bi bi-person-workspace fs-4"></i>
                                        <span class="small fw-bold">Find a Job</span>
                                        <span class="text-muted" style="font-size: 0.72rem;">Candidate Portal</span>
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="roleRecruiter" value="ROLE_RECRUITER" th:field="*{role}">
                                    <label class="btn btn-outline-primary w-100 py-3 d-flex flex-column align-items-center justify-content-center gap-1" for="roleRecruiter">
                                        <i class="bi bi-building-up fs-4"></i>
                                        <span class="small fw-bold">Hire Talent</span>
                                        <span class="text-muted" style="font-size: 0.72rem;">Employer ATS</span>
                                    </label>
                                </div>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        </div>

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Alex Morgan" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@company.com" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <!-- Phone Number -->
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Phone Number (10 Digits)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password (Min. 6 Characters)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                            <i class="bi bi-check-circle me-1"></i> Create Account
                        </button>
                    </form>

                    <div class="text-center small text-secondary">
                        Already have an account? <a th:href="@{/login}" class="fw-semibold text-primary">Log in here</a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
